<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Operations Support v0.8.00</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head><body><div class="app"><header class="header"><span class="version">v0.8.00</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main"><div class="intro"><h1>Dashboard</h1><p>主頁概覽</p></div><div class="stats"><a class="stat open" href="issues.html"><small>Open</small><strong id="openCount">0</strong><span>未完成</span></a><div class="stat suspended"><small>Suspended</small><strong id="suspendedCount">0</strong><span>暫停運作</span></div><div class="stat today"><small>Today</small><strong id="todayCount">0</strong><span>今日報告</span></div></div><a class="report-card" href="report.html"><span><strong>Report an Issue</strong><small>報告故障</small></span><span class="arrow">›</span></a><div class="device-note"><b>This Device Only</b><span>報告目前只儲存在此裝置，暫未跨裝置共享。</span></div><div class="section-head"><div><b>Recent Reports</b><small>最近報告</small></div><span><a class="text-link" href="completed.html">Completed 已完成</a><a class="text-link" href="issues.html">View All 查看全部</a></span></div><div id="recent" class="list"></div></main><nav class="bottom-nav"><a class="nav-link active" href="index.html"><span>⌂</span>Home 主頁</a><div class="plus-wrap"><a class="plus-button" href="report.html" aria-label="Report an Issue 報告故障">+</a></div><a class="nav-link" href="issues.html"><span>◷</span>Open 未完成</a></nav></div><script src="config.js"></script><script src="app.js"></script><script>const a=OPS.get(),today=new Date().toISOString().slice(0,10);openCount.textContent=a.length;suspendedCount.textContent=a.filter(x=>x.statusEn==='Operation Suspended').length;todayCount.textContent=a.filter(x=>x.submitted.slice(0,10)===today).length;recent.innerHTML=a.length?a.slice(0,3).map(x=>`<article class="card issue-card ${OPS.statusClass(x.statusEn)}"><b>${x.plant} · ${x.material} · ${x.issueZh}</b><small>${OPS.fmt(x.incident)} · ${x.statusZh}</small></article>`).join(''):'<div class="card">尚未有報告。</div>';</script></body></html>
