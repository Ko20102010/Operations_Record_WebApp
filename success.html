<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Report Submitted v0.7.04</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><span class="version">v0.7.04</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main success"><div class="check">✓</div><h1>Report Submitted</h1><p>報告已成功提交，並儲存在此裝置。</p><div id="reference" class="reference"></div><div class="field"><label class="label">Message Language 訊息語言</label><div class="language-grid"><button class="language selected" data-lang="zh">中文</button><button class="language" data-lang="en">English</button></div><textarea id="message" class="message" readonly></textarea><div class="actions"><button id="copy" class="action primary">複製中文訊息</button><button id="whatsapp" class="action whatsapp">開啟 WhatsApp</button></div></div><div class="actions"><a class="action secondary" href="index.html">Back to Home 返回主頁</a><a class="action primary" href="report.html">Report Another 再報告故障</a></div></main></div><script src="config.js"></script><script src="app.js"></script><script>let lang='zh',ticket=new URLSearchParams(location.search).get('ticket'),x=OPS.get().find(y=>y.ticket===ticket);reference.textContent='Reference Number 參考編號：'+(ticket||'');function render(){if(!x)return;const a=lang==='zh'?[`廠房：${x.plant}`,`物料：${x.material}`,`事發時間：${OPS.fmt(x.incident)}`,`問題類別：${x.typeZh}`,`相關問題：${x.issueZh}`,`運作情況：${x.statusZh}`]:[`Plant: ${x.plant}`,`Material: ${x.material}`,`Incident Time: ${OPS.fmt(x.incident)}`,`Issue Type: ${x.typeEn}`,`Issue: ${x.issueEn}`,`Operating Status: ${x.statusEn}`];if(x.remark)a.push((lang==='zh'?'情況說明：':'Remark: ')+x.remark);message.value=a.join('\n');copy.textContent=lang==='zh'?'複製中文訊息':'Copy English Message'}document.querySelectorAll('.language').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('.language').forEach(y=>y.classList.toggle('selected',y===b));render()});copy.onclick=()=>navigator.clipboard.writeText(message.value);whatsapp.onclick=()=>open('https://wa.me/?text='+encodeURIComponent(message.value),'_blank');render();</script></body></html>
