<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Completed Issues v0.8.01</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><span class="version">v0.8.01</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main"><a class="back" href="index.html">‹ Back 返回</a><h1 class="page-title">Completed Issues <small>已完成問題</small></h1><div id="completed" class="list"></div></main></div><script src="config.js"></script><script src="app.js"></script><script>const pencil=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>`;const a=OPS.get().filter(x=>x.workflowStatus==='Completed');completed.className='report-list';completed.innerHTML=a.length?a.map(x=>`<article class="report-item no-impact"><div class="report-main"><span class="report-primary">${x.plant} · ${x.material} · ${x.issueZh}</span><span class="report-secondary">${x.issueEn} · 已完成</span><span class="report-meta">${OPS.fmt(x.incident)}</span></div><a class="pencil-button" href="edit.html?ticket=${encodeURIComponent(x.ticket)}" aria-label="View or edit completed issue 查看或編輯已完成問題">${pencil}</a></article>`).join(''):'<div class="empty-state">尚未有已完成問題。</div>';</script></body></html>
