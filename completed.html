<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Completed Issues v0.8.00</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><span class="version">v0.8.00</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main"><a class="back" href="index.html">‹ Back 返回</a><h1 class="page-title">Completed Issues <small>已完成問題</small></h1><div id="completed" class="list"></div></main></div><script src="config.js"></script><script src="app.js"></script><script>const a=OPS.get().filter(x=>x.workflowStatus==='Completed');completed.innerHTML=a.length?a.map(x=>`<article class="card issue-card no-impact"><b>${x.plant} · ${x.material}</b><div>${x.issueEn}／${x.issueZh}</div><small>${OPS.fmt(x.incident)}</small><br><span class="badge complete-badge">Completed／已完成</span><div><a class="edit" href="edit.html?ticket=${encodeURIComponent(x.ticket)}">View / Edit 查看／編輯</a></div></article>`).join(''):'<div class="card">尚未有已完成問題。</div>';</script></body></html>
