<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edit Issue v0.8.00</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><span class="version">v0.8.00</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main"><a class="back" href="issues.html">‹ Back 返回</a><h1 class="page-title">Update Issue <small>更新問題</small></h1><div id="missing" class="card" hidden>Report not found. 找不到報告。</div><section id="editForm"><div id="summary" class="edit-form-note"></div><div class="field"><label class="label">Operating Status 運作情況 <span class="required">*</span></label><div id="operatingStatus" class="status-grid"><button class="choice no-impact" data-en="No Operational Impact" data-zh="不影響運作">No Operational Impact<small>不影響運作</small></button><button class="choice limited" data-en="Limited Operation" data-zh="有限度運作">Limited Operation<small>有限度運作</small></button><button class="choice suspended" data-en="Operation Suspended" data-zh="暫停運作">Operation Suspended<small>暫停運作</small></button></div></div><div class="field"><label class="label" for="workflowStatus">Issue Status 問題狀態 <span class="required">*</span></label><select id="workflowStatus"><option value="Reported">Reported 已報告</option><option value="In Progress">In Progress 處理中</option><option value="Completed">Completed 已完成</option></select><span class="sub">Select Completed only after the issue has been resolved. 問題解決後才選擇「已完成」。</span></div><div class="field"><label class="label" for="remark">Update Note 更新說明</label><textarea id="remark" rows="4" placeholder="Add the latest update 請輸入最新處理情況"></textarea></div><button id="save" class="submit">Save Changes 儲存修改</button></section></main><nav class="bottom-nav"><a class="nav-link" href="index.html"><span>⌂</span>Home 主頁</a><div class="plus-wrap"><a class="plus-button" href="report.html" aria-label="Report an Issue 報告故障">+</a></div><a class="nav-link active" href="issues.html"><span>◷</span>Open 未完成</a></nav></div><script src="config.js"></script><script src="app.js"></script><script>const ticket=new URLSearchParams(location.search).get('ticket'),records=OPS.get(),idx=records.findIndex(x=>x.ticket===ticket),item=records[idx],zh={Reported:'已報告','In Progress':'處理中',Completed:'已完成'};if(!item){editForm.hidden=true;missing.hidden=false}else{summary.innerHTML=`<b>${item.ticket}</b><br>${item.plant} · ${item.material} · ${item.issueEn}／${item.issueZh}<br><span class="sub">${OPS.fmt(item.incident)}</span>`;workflowStatus.value=item.workflowStatus||'Reported';remark.value=item.updateNote||item.remark||'';document.querySelectorAll('#operatingStatus .choice').forEach(b=>{b.classList.toggle('selected',b.dataset.en===item.statusEn);b.onclick=()=>{document.querySelectorAll('#operatingStatus .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');item.statusEn=b.dataset.en;item.statusZh=b.dataset.zh}});save.onclick=async()=>{if(!await OPS.latest())return;const selected=document.querySelector('#operatingStatus .selected');if(!selected)return alert('Please select Operating Status. 請選擇運作情況。');item.statusEn=selected.dataset.en;item.statusZh=selected.dataset.zh;item.workflowStatus=workflowStatus.value;item.workflowStatusZh=zh[workflowStatus.value];item.updateNote=remark.value.trim();item.updated=new Date().toISOString();records[idx]=item;OPS.set(records);location.href=item.workflowStatus==='Completed'?'completed.html':'issues.html'}};</script></body></html>
