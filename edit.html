<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Edit Issue v0.8.11</title>
  <link rel="stylesheet" href="styles.css?v=0.8.11">
</head>
<body>
  <a class="skip-link" href="#main"><span class="bilingual-en">Skip to content</span><span class="bilingual-zh" lang="zh-HK">跳至主內容</span></a>
  <div class="app">
    <header class="header">
      <span class="version">v0.8.11</span>
      <strong class="bilingual-en">Operations Support</strong>
      <small class="bilingual-zh" lang="zh-HK">前線故障報告</small>
    </header>
    <main id="main" class="main">
      <a class="back" href="issues.html"><span class="bilingual-en">‹ Back</span><span class="bilingual-zh" lang="zh-HK">‹ 返回</span></a>
      <h1 class="page-title"><span class="bilingual-en">Update Issue</span><small class="bilingual-zh" lang="zh-HK">更新問題</small></h1>
      <div id="missing" class="card" hidden><span class="bilingual-en">Report not found.</span><span class="bilingual-zh" lang="zh-HK">找不到報告。</span></div>
      <section id="editForm">
        <div id="summary" class="edit-form-note" role="group" data-aria-en="Report summary" data-aria-zh="報告摘要" aria-label="Report summary"></div>
        <div id="originalRemark" class="edit-form-note original-remark" role="note" data-aria-en="Original incident details" data-aria-zh="原始報告內容" aria-label="Original incident details" hidden></div>
        <fieldset class="field fieldset-reset">
          <legend id="operatingStatusLabel" class="label"><span class="bilingual-en">Operating Status</span><span class="bilingual-zh" lang="zh-HK">運作情況</span> <span class="required">*</span></legend>
          <div id="operatingStatus" class="status-grid">
            <button type="button" class="choice no-impact" data-en="No Operational Impact" data-zh="不影響運作" aria-pressed="false"><span class="bilingual-en">No Operational Impact</span><span class="bilingual-zh" lang="zh-HK">不影響運作</span></button>
            <button type="button" class="choice limited" data-en="Limited Operation" data-zh="有限度運作" aria-pressed="false"><span class="bilingual-en">Limited Operation</span><span class="bilingual-zh" lang="zh-HK">有限度運作</span></button>
            <button type="button" class="choice suspended" data-en="Operation Suspended" data-zh="暫停運作" aria-pressed="false"><span class="bilingual-en">Operation Suspended</span><span class="bilingual-zh" lang="zh-HK">暫停運作</span></button>
          </div>
        </fieldset>
        <div class="field">
          <label class="label" for="workflowStatus"><span class="bilingual-en">Issue Status</span><span class="bilingual-zh" lang="zh-HK">問題狀態</span> <span class="required">*</span></label>
          <select id="workflowStatus">
            <option value="Reported" data-en="Reported" data-zh="已報告">Reported</option>
            <option value="In Progress" data-en="In Progress" data-zh="處理中">In Progress</option>
            <option value="Completed" data-en="Completed" data-zh="已完成">Completed</option>
          </select>
          <span class="sub"><span class="bilingual-en">Select Completed only after the issue has been resolved.</span><span class="bilingual-zh" lang="zh-HK">問題解決後才選擇「已完成」。</span></span>
        </div>
        <div class="field">
          <label class="label" for="remark"><span class="bilingual-en">Update Note</span><span class="bilingual-zh" lang="zh-HK">更新說明</span></label>
          <textarea id="remark" rows="4" data-en-placeholder="Add the latest update" data-zh-placeholder="請輸入最新處理情況"></textarea>
        </div>
        <button id="save" class="submit bilingual-control" type="button"><span class="bilingual-en">Save changes</span><span class="bilingual-zh" lang="zh-HK">儲存修改</span></button>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation 主導覽">
      <a class="nav-link" href="index.html"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label"><span class="bilingual-en">Home</span><span class="bilingual-zh" lang="zh-HK">主頁</span></span></a>
      <a class="nav-link nav-create" href="report.html" aria-label="Create a new report 建立新報告"><span class="nav-icon" aria-hidden="true">+</span><span class="nav-label"><span class="bilingual-en">New</span><span class="bilingual-zh" lang="zh-HK">新增</span></span></a>
      <a class="nav-link active" href="issues.html" aria-current="page"><span class="nav-icon" aria-hidden="true">◷</span><span class="nav-label"><span class="bilingual-en">Open</span><span class="bilingual-zh" lang="zh-HK">未完成</span></span></a>
      <a class="nav-link" href="history.html"><span class="nav-icon" aria-hidden="true">☷</span><span class="nav-label"><span class="bilingual-en">History</span><span class="bilingual-zh" lang="zh-HK">記錄</span></span></a>
    </nav>
  </div>
  <script src="config.js?v=0.8.11"></script>
  <script src="app.js?v=0.8.11"></script>
  <script>
    const ticket = new URLSearchParams(location.search).get('ticket');
    const records = OPS.get();
    const index = records.findIndex(record => record.ticket === ticket);
    const item = records[index];
    const isChinese = OPS.getLanguage() === 'zh';
    const statusZh = { Reported: '已報告', 'In Progress': '處理中', Completed: '已完成' };
    document.querySelectorAll('#workflowStatus option').forEach(option => {
      option.textContent = option.dataset[isChinese ? 'zh' : 'en'];
    });
    const statusChoices = [...document.querySelectorAll('#operatingStatus .choice')];

    if (!item) {
      editForm.hidden = true;
      missing.hidden = false;
    } else {
      summary.textContent = `${item.ticket}\n${item.plant} · ${item.material} · ${isChinese ? item.issueZh : item.issueEn}\n${OPS.fmt(item.incident)}`;
      if (item.remark) {
        originalRemark.textContent = `${isChinese ? '原始報告' : 'Original report'}: ${item.remark}`;
        originalRemark.hidden = false;
      }

      workflowStatus.value = item.workflowStatus || 'Reported';
      remark.value = item.updateNote || '';

      statusChoices.forEach(button => {
        const selected = button.dataset.en === item.statusEn;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
        button.onclick = () => {
          statusChoices.forEach(choice => {
            choice.classList.remove('selected');
            choice.setAttribute('aria-pressed', 'false');
          });
          button.classList.add('selected');
          button.setAttribute('aria-pressed', 'true');
          button.setAttribute('aria-pressed', 'true');
        };
      });

      save.onclick = async () => {
        if (!await OPS.latest()) return;

        const selected = document.querySelector('#operatingStatus .selected');
        if (!selected) {
          alert(isChinese ? '請選擇運作情況。' : 'Please select Operating Status.');
          return;
        }

        item.statusEn = selected.dataset.en;
        item.statusZh = selected.dataset.zh;
        item.workflowStatus = workflowStatus.value;
        item.workflowStatusZh = statusZh[workflowStatus.value];
        item.updateNote = remark.value.trim();
        item.updated = new Date().toISOString();
        records[index] = item;
        OPS.set(records);
        location.href = item.workflowStatus === 'Completed' ? 'completed.html' : 'issues.html';
      };
    }
  </script>
</body>
</html>
