<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Report an Issue v0.8.02</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header class="header"><span class="version">v0.8.02</span><strong>Operations Support</strong><small>前線故障報告</small></header><main class="main"><a class="back" href="index.html">‹ Back 返回</a><h1 class="page-title">Report an Issue <small>報告故障</small></h1><div class="grid2"><div class="field"><label class="label">Plant 廠房 <span class="required">*</span></label><select id="plant"><option value="">Select 選擇</option></select></div><div class="field"><label class="label">Material 物料 <span class="required">*</span></label><select id="material"><option value="">Select 選擇</option></select></div></div><div class="field"><label class="label">Incident Time 事發時間 <span class="required">*</span></label><div class="grid2"><div><span class="sub">Date 日期</span><input id="date" type="date"></div><div><span class="sub">Time 時間</span><input id="time" type="time"></div></div></div><div class="field"><label class="label">Issue Type 問題類別 <span class="required">*</span></label><div id="typeGrid" class="type-grid"></div></div><div id="optionWrap" class="field conditional"><label id="optionLabel" class="label">Related Issue 相關問題 <span class="required">*</span></label><div id="optionGrid" class="option-grid"></div></div><div class="field"><label class="label">Operating Status 運作情況 <span class="required">*</span></label><div id="statusGrid" class="status-grid"><button class="choice no-impact" data-en="No Operational Impact" data-zh="不影響運作">No Operational Impact<small>不影響運作</small></button><button class="choice limited" data-en="Limited Operation" data-zh="有限度運作">Limited Operation<small>有限度運作</small></button><button class="choice suspended" data-en="Operation Suspended" data-zh="暫停運作">Operation Suspended<small>暫停運作</small></button></div></div><div class="field"><label class="label">Photo 相片 <span class="sub">Optional 選填</span></label><div class="photo-actions"><button id="take" class="action primary">Take Photo 拍攝相片</button><button id="choose" class="action secondary">Choose Photo 選擇相片</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="gallery" type="file" accept="image/*" hidden><div id="photoPreview" class="photo-preview"><img id="photoImg"><div id="photoName" class="sub"></div><button id="remove" class="text-link">Remove Photo 移除相片</button></div></div><div class="field"><label id="remarkLabel" class="label">What Happened? 情況說明 <span class="sub">Optional 選填</span></label><textarea id="remark" rows="3" placeholder="Briefly describe what you observed 請簡單說明現場所見情況"></textarea></div><div id="preview" class="field preview"><label class="label">Preview 預覽</label><div class="preview-row"><span>Plant 廠房</span><b id="pvPlant"></b></div><div class="preview-row"><span>Material 物料</span><b id="pvMaterial"></b></div><div class="preview-row"><span>Incident Time</span><b id="pvTime"></b></div><div class="preview-row"><span>Issue Type</span><b id="pvType"></b></div><div class="preview-row"><span>Related Issue</span><b id="pvIssue"></b></div><div class="preview-row"><span>Operating Status</span><b id="pvStatus"></b></div></div><button id="submit" class="submit" disabled>Submit Report 提交報告</button></main><nav class="bottom-nav"><a class="nav-link" href="index.html"><span>⌂</span>Home 主頁</a><div class="plus-wrap"><a class="plus-button" href="report.html" aria-label="Report an Issue 報告故障">+</a></div><a class="nav-link" href="issues.html"><span>◷</span>Open 未完成</a></nav></div><div id="updateOverlay" class="update-overlay"><div class="update-dialog"><h2>Update Required 需要更新</h2><p>請先更新版本，然後再提交或編輯報告。</p><button class="submit" onclick="location.reload()">Update Now 立即更新</button></div></div><script src="config.js"></script><script src="app.js"></script><script src="report.js"></script></body></html>
